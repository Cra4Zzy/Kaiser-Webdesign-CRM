<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaiser CRM V9.9.1 PAGES · Workspace</title><link rel="icon" href="Kaiser-CRM.ico"><link rel="stylesheet" href="crm.css?v=9.9.1"><link rel="stylesheet" href="crm-workflow.css?v=10.3.0"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#142b35"><style>
#teamPresence[hidden]{display:none!important}
#teamPresence{position:relative;flex-shrink:0;font-size:12px;color:#17674f}
#teamPresence summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:5px;border:1px solid #cde8dc;background:#f0faf6;border-radius:999px;padding:7px 10px;white-space:nowrap;font-weight:600;line-height:1.2}
#teamPresence summary::-webkit-details-marker{display:none}
#teamPresence summary:focus-visible{outline:2px solid #238363;outline-offset:3px}
#teamPresence .presence-dot{width:7px;height:7px;border-radius:50%;background:#219669;flex:none}
#teamPresence[data-state="unavailable"] summary{background:#f2f4f7;border-color:#dce1e7;color:#637184}
#teamPresence[data-state="unavailable"] summary .presence-dot{background:#8793a3}
#teamPresence .presence-panel{position:absolute;top:calc(100% + 12px);right:0;width:230px;padding:14px 16px;background:#fff;border:1px solid #e0e6e7;border-radius:12px;box-shadow:0 12px 35px #17212f24;color:#233744;z-index:20}
#teamPresence .presence-panel strong{font-size:13px;display:block}
#teamPresence .presence-panel small{display:block;margin-top:8px;color:#687789;font-size:10px;line-height:1.5}
#teamPresence .presence-list{margin:10px 0 0;padding:0;list-style:none;max-height:240px;overflow:auto}
#teamPresence .presence-list li{display:flex;align-items:center;gap:8px;padding:6px 0}
#teamPresence .presence-name{overflow-wrap:anywhere}
@media(max-width:900px){#teamPresence .presence-label{display:none}#teamPresence summary{padding:7px 8px}}
@media(max-width:650px){#teamPresence .presence-panel{position:fixed;top:65px;right:12px;width:min(230px,calc(100vw - 24px))}.top-actions:has(#teamPresence:not([hidden])) .global-search input{width:clamp(70px,24vw,135px)}}
</style></head>
